name: Normal Nerd Font Mono/Propo Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  custom-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

          # https://github.com/ryanoasis/nerd-fonts/blob/b3c1b0cf424ac32915cf4fd822c3938d4a815566/.github/workflows/release.yml#L144-L166
          if [[ "${{ github.event.inputs.build_args }}" == *"--font-patcher"* ]] || python build.py --dry | jq -e '.nerd_font.use_font_patcher == true' >/dev/null; then
            sudo apt update -y -q
            sudo apt install software-properties-common -y -q
            sudo apt install python3-fontforge -y -q
            sudo apt install fuse -y -q

            curl -L "https://github.com/fontforge/fontforge/releases/download/20230101/FontForge-2023-01-01-a1dad3e-x86_64.AppImage" --output fontforge
            chmod u+x fontforge
            echo Try appimage
            ./fontforge --version
            export PATH=`pwd`:$PATH
            echo "PATH=$PATH" >> $GITHUB_ENV
            echo Try appimage with path
            fontforge --version
          fi

      - name: Run custom script for NFM
        run: |
          build_args="--archive --hinted --ttf-only --normal --liga --nf-mono"
          if [ -n "${{ github.event.inputs.feat }}" ]; then
            build_args="$build_args --feat ${{ github.event.inputs.feat }}"
          fi
          if [ -n "${{ github.event.inputs.build_args }}" ]; then
            build_args="$build_args ${{ github.event.inputs.build_args }}"
          fi          
          echo "BUILD_ARGS=$build_args" >> $GITHUB_ENV
          python build.py $build_args
        continue-on-error: true
      - id: check_issue_nfm
        name: Check issue feature file
        run: |
          if [ -f fonts/issue.fea ]
          then
            echo 'exists=true' >> $GITHUB_OUTPUT
          else
            echo 'exists=false' >> $GITHUB_OUTPUT
          fi          
      - name: Rename fonts zip to avoid collisions for NFM
        run: |
          mkdir -p upload
          # Use -exec with \; to process files individually, allowing us to prefix the filename
          find fonts/archive/ -name "*.zip" -exec bash -c '
            for file do
              filename=$(basename "$file")
              mv "$file" "upload/NFM_$filename"
            done
          ' bash {} +
      - name: Rename fonts sha256 to avoid collisions for NFM
        run: |
          mkdir -p upload
          # Use -exec with \; to process files individually, allowing us to prefix the filename
          find fonts/archive/ -name "*.sha256" -exec bash -c '
            for file do
              filename=$(basename "$file")
              mv "$file" "upload/NFM_$filename"
            done
          ' bash {} +

      - name: Run custom script for NFP
        run: |
          build_args="--archive --hinted --ttf-only --normal --liga --nf-propo"
          if [ -n "${{ github.event.inputs.feat }}" ]; then
            build_args="$build_args --feat ${{ github.event.inputs.feat }}"
          fi
          if [ -n "${{ github.event.inputs.build_args }}" ]; then
            build_args="$build_args ${{ github.event.inputs.build_args }}"
          fi          
          echo "BUILD_ARGS=$build_args" >> $GITHUB_ENV
          python build.py $build_args
        continue-on-error: true
      - id: check_issue_nfp
        name: Check issue feature file
        run: |
          if [ -f fonts/issue.fea ]
          then
            echo 'exists=true' >> $GITHUB_OUTPUT
          else
            echo 'exists=false' >> $GITHUB_OUTPUT
          fi          
      - name: Rename fonts zip to avoid collisions for NFP
        run: |
          mkdir -p upload
          # Use -exec with \; to process files individually, allowing us to prefix the filename
          find fonts/archive/ -name "*.zip" -exec bash -c '
            for file do
              filename=$(basename "$file")
              mv "$file" "upload/NFP_$filename"
            done
          ' bash {} +
      - name: Rename fonts sha256 to avoid collisions for NFP
        run: |
          mkdir -p upload
          # Use -exec with \; to process files individually, allowing us to prefix the filename
          find fonts/archive/ -name "*.sha256" -exec bash -c '
            for file do
              filename=$(basename "$file")
              mv "$file" "upload/NFP_$filename"
            done
          ' bash {} +
        
      - name: Upload issue artifact NFM
        if: ${{ steps.check_issue_nfm.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-fea-file-nfm
          path: fonts/issue-nfm.fea
      - name: Upload issue artifact NFP
        if: ${{ steps.check_issue_nfp.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-fea-file-nfp
          path: fonts/issue-nfp.fea
      - name: Create release
        run: |
          if [ ! -d "fonts/archive" ]; then
            echo "Error: Failed to build font, please check [Run custom script] step."
            exit 1
          fi
          echo "### Build arguments" >> NOTES
          echo "\`\`\`" >> NOTES
          echo "python build.py $BUILD_ARGS" >> NOTES
          echo "\`\`\`" >> NOTES
          echo "### Final Configuration" >> NOTES
          echo "\`\`\`" >> NOTES
          python build.py $BUILD_ARGS --dry | sed '1s/^/font_config: /' >> NOTES
          echo "\`\`\`" >> NOTES
          gh release create "v$(date +%s)" upload/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
