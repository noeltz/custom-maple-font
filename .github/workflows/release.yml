name: Build Maple Mono Normal NerdFont Mono/Propo

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      build_args:
        description: 'Args for build.py'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        config: [
          {name: Mono, args: "--normal --liga --nf-mono"},
          {name: Propo, args: "--normal --liga --nf-propo"}
        ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: './requirements.txt'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Build fonts
      # Removed --archive. Note: logs show output goes to 'fonts/' folder
      run: |
        python build.py --ttf-only --hinted ${{ matrix.config.args }} ${{ github.event.inputs.build_args }}

    - name: Rename fonts to avoid collisions
      # We check the 'fonts/' directory. 
      # We move all .ttf files from subdirectories into a flat 'upload' folder
      # and prefix them with the matrix name to ensure uniqueness.
      run: |
        mkdir upload
        find fonts/ -name "*.ttf" -exec cp {} upload/${{ matrix.config.name }}_{} +
        # Cleanup path slashes in filenames if any
        cd upload && for f in fonts_*; do mv "$f" "${f//fonts_/}"; done

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.config.name }}
        path: upload/*.ttf

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: all-fonts
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: all-fonts/*.ttf
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
