name: Build Maple Mono Normal NerdFont Mono/Propo

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      build_args:
        description: 'Args for build.py'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        config: [
          {name: mono, args: "--normal --liga --nf-mono"},
          {name: propo, args: "--normal --liga --nf-propo"}
        ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: './requirements.txt'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Build fonts
      run: |
        python build.py --ttf-only --hinted ${{ matrix.config.args }} ${{ github.event.inputs.build_args }}

    - name: Rename fonts to avoid collisions
      run: |
        mkdir -p upload
        # Use -exec with \; to process files individually, allowing us to prefix the filename
        find fonts/ -name "*.ttf" -exec bash -c '
          for file do
            filename=$(basename "$file")
            cp "$file" "upload/${{ matrix.config.name }}_$filename"
          done
        ' bash {} +

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.config.name }}
        path: upload/*.ttf

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: all-fonts
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: all-fonts/*.ttf
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
