name: Build All Formats and Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      build_args:
        description: 'Args for build.py'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        config: [
          {name: normal-liga-nf-mono, args: "--normal --liga --nf-mono"},
          {name: normal-liga-nf-propo, args: "--normal --liga --nf-propo"}
        ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: './requirements.txt'
    - run: pip install -r requirements.txt
    - name: Build fonts
      run: |
        python build.py --ttf-only --hinted ${{ matrix.config.args }} ${{ github.event.inputs.build_args }}
    - uses: actions/upload-artifact@v4
      with:
        name: release-artifacts-${{ matrix.config.name }}
        path: fonts/archive/*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        pattern: release-artifacts*
        path: release

    - name: Release artifacts
      run: python task.py publish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
